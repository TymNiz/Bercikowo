<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bercikowo — Portal Pasażera</title>
    <style>
        :root {
            --bg-body: #0f172a;
            --bg-surface: #1e293b;
            --bg-surface-light: #334155;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --text-light: #f8fafc;
            --accent: #f59e0b;
            --accent-hover: #d97706;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --border: #e2e8f0;
            --success: #10b981;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f1f5f9;
            color: var(--text-main);
            line-height: 1.5;
        }

        /* NAGŁÓWEK KOLEJOWY */
        header {
            background: linear-gradient(135deg, #090d16 0%, #1e293b 100%);
            color: var(--text-light);
            border-bottom: 4px solid var(--accent);
            padding: 1.75rem 1.5rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
        }

        .header-inner {
            max-width: 1140px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .brand-logo {
            background: var(--accent);
            color: #090d16;
            font-weight: 900;
            font-size: 1.5rem;
            padding: 0.5rem 0.85rem;
            border-radius: 8px;
            letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.4);
        }

        .brand-text h1 {
            font-size: 1.65rem;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .brand-text p {
            color: #94a3b8;
            font-size: 0.9rem;
        }

        .clock-box {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 0.6rem 1.1rem;
            border-radius: 8px;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .clock-time {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--accent);
        }

        .clock-date {
            font-size: 0.8rem;
            color: #cbd5e1;
        }

        /* NAWIGACJA */
        .nav-wrapper {
            background: var(--bg-surface);
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-tabs {
            max-width: 1140px;
            margin: 0 auto;
            display: flex;
            gap: 0.5rem;
            padding: 0.65rem 1.5rem;
            overflow-x: auto;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: #cbd5e1;
            padding: 0.65rem 1.25rem;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .tab-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
        }

        .tab-btn.active {
            background: var(--accent);
            color: #090d16;
            font-weight: 700;
        }

        /* GŁÓWNY KONTENER */
        .container {
            max-width: 1140px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.25s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .panel {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 1.75rem;
            box-shadow: 0 4px 15px rgba(15, 23, 42, 0.06);
            border: 1px solid var(--border);
            margin-bottom: 1.5rem;
        }

        .panel-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--bg-body);
            margin-bottom: 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 0.75rem;
        }

        /* FORMULARZE */
        .search-grid {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 1rem;
            align-items: end;
            margin-bottom: 1.25rem;
        }

        .search-subgrid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 1.25rem;
        }

        @media (max-width: 768px) {
            .search-grid {
                grid-template-columns: 1fr;
            }
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        label {
            font-size: 0.82rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
        }

        select, input {
            padding: 0.75rem 0.9rem;
            border: 1.5px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.98rem;
            color: var(--text-main);
            background: #ffffff;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        select:focus, input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .btn-swap {
            background: #f1f5f9;
            border: 1.5px solid #cbd5e1;
            color: var(--text-main);
            width: 44px;
            height: 44px;
            border-radius: 8px;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .btn-swap:hover {
            background: #e2e8f0;
            border-color: #94a3b8;
        }

        /* STACJE POŚREDNIE (PRZEZ) */
        .via-box {
            background: #f8fafc;
            border: 1px dashed #cbd5e1;
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1.25rem;
        }

        .via-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.6rem;
        }

        .via-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            align-items: center;
        }

        .via-item {
            display: flex;
            align-items: center;
            gap: 0.35rem;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            padding: 0.3rem 0.5rem;
            border-radius: 6px;
        }

        .via-item select {
            border: none;
            padding: 0.25rem;
            font-size: 0.9rem;
        }

        .via-item select:focus {
            box-shadow: none;
        }

        .btn-remove-via {
            background: #fee2e2;
            color: var(--danger);
            border: none;
            width: 24px;
            height: 24px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-add-via {
            background: #e0e7ff;
            color: var(--primary);
            border: none;
            padding: 0.45rem 0.85rem;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-add-via:hover {
            background: #c7d2fe;
        }

        .btn-search {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.9rem 1.75rem;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
            letter-spacing: 0.3px;
        }

        .btn-search:hover {
            background: var(--primary-hover);
        }

        /* KARTY WYNIKÓW POŁĄCZEŃ */
        .journey-card {
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 10px;
            margin-bottom: 1rem;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            transition: transform 0.15s, box-shadow 0.15s;
        }

        .journey-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
        }

        .journey-summary {
            background: #f8fafc;
            padding: 1rem 1.25rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .journey-times {
            display: flex;
            align-items: center;
            gap: 1rem;
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--bg-body);
        }

        .journey-arrow {
            color: var(--text-muted);
            font-weight: 400;
            font-size: 1rem;
        }

        .journey-meta {
            display: flex;
            gap: 0.6rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .badge {
            padding: 0.25rem 0.65rem;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .badge-direct {
            background: #dcfce7;
            color: #166534;
        }

        .badge-transfer {
            background: #fef3c7;
            color: #92400e;
        }

        .badge-time {
            background: #e2e8f0;
            color: #334155;
        }

        .journey-legs {
            padding: 1.1rem 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
        }

        .leg-row {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 1rem;
            padding-left: 0.85rem;
            border-left: 3px solid var(--primary);
        }

        .leg-train-info {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 0.25rem;
        }

        .train-cat {
            background: var(--bg-body);
            color: var(--accent);
            padding: 0.15rem 0.5rem;
            border-radius: 4px;
            font-size: 0.78rem;
            font-weight: 800;
        }

        .train-stock {
            background: #f1f5f9;
            color: #475569;
            border: 1px solid #cbd5e1;
            padding: 0.1rem 0.45rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .leg-route {
            font-size: 0.92rem;
            color: #334155;
        }

        .transfer-divider {
            background: #fffbeb;
            border: 1px solid #fde68a;
            color: #92400e;
            padding: 0.45rem 0.85rem;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        /* TABLICA STACYJNA (WYŚWIETLACZ KOLEJOWY) */
        .board-header-toggle {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .board-type-btn {
            flex: 1;
            padding: 0.75rem;
            border: 2px solid var(--border);
            background: #f8fafc;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .board-type-btn.active {
            background: var(--bg-body);
            color: var(--accent);
            border-color: var(--bg-body);
        }

        .station-table-wrap {
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid #1e293b;
        }

        .station-board-table {
            width: 100%;
            border-collapse: collapse;
            background: #0f172a;
            color: #f8fafc;
        }

        .station-board-table th {
            background: #1e293b;
            color: var(--accent);
            text-transform: uppercase;
            font-size: 0.78rem;
            letter-spacing: 0.6px;
            padding: 0.85rem 1rem;
            text-align: left;
            border-bottom: 2px solid #334155;
        }

        .station-board-table td {
            padding: 0.85rem 1rem;
            border-bottom: 1px solid #1e293b;
            font-size: 0.92rem;
        }

        .station-board-table tr:hover td {
            background: #1e293b;
        }

        .board-time {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--accent);
            font-variant-numeric: tabular-nums;
        }

        /* KATALOG POCIĄGÓW */
        .stops-timeline {
            margin-top: 0.85rem;
            border-top: 1px solid var(--border);
            padding-top: 0.85rem;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 0.5rem;
        }

        .stop-chip {
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0.45rem 0.7rem;
            font-size: 0.85rem;
        }

        .stop-chip strong {
            display: block;
            color: var(--bg-body);
        }

        .stop-chip span {
            color: var(--text-muted);
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-inner">
            <div class="brand">
                <div class="brand-logo">ZNZ</div>
                <div class="brand-text">
                    <h1>Bercikowo - Portal Pasażera</h1>
                    <p>System Informacji Pasażerskiej • Rozkład Jazdy • Wykonanie: ZNZ</p>
                </div>
            </div>
            <div class="clock-box">
                <div class="clock-time" id="liveClock">12:00:00</div>
                <div class="clock-date" id="liveDate">Czwartek, 12.11.2026</div>
            </div>
        </div>
    </header>

    <div class="nav-wrapper">
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('search', this)">Wyszukiwarka połączeń</button>
            <button class="tab-btn" onclick="switchTab('station', this)">Tablica stacyjna (Przyjazdy / Odjazdy)</button>
            <button class="tab-btn" onclick="switchTab('catalog', this)">Wyszukaj pociąg (Numer / Nazwa)</button>
        </div>
    </div>

    <div class="container">

        <!-- 1. WYSZUKIWARKA POŁĄCZEŃ -->
        <div id="search" class="tab-content active">
            <div class="panel">
                <div class="panel-title">Zaplanuj podróż po Bercikowie</div>

                <div class="search-grid">
                    <div class="form-group">
                        <label for="srcStation">Stacja początkowa (Skąd)</label>
                        <select id="srcStation"></select>
                    </div>
                    <button class="btn-swap" onclick="swapStations()" title="Zamień stacje">⇄</button>
                    <div class="form-group">
                        <label for="destStation">Stacja docelowa (Dokąd)</label>
                        <select id="destStation"></select>
                    </div>
                </div>

                <!-- Stacje pośrednie (Przez) -->
                <div class="via-box">
                    <div class="via-header">
                        <label style="margin:0;">Stacje pośrednie (Przez — pociąg musi przez nie przejechać)</label>
                        <button type="button" class="btn-add-via" onclick="addViaStation()">+ Dodaj stację pośrednią</button>
                    </div>
                    <div id="viaContainer" class="via-list">
                        <span id="viaEmptyHint" style="font-size: 0.85rem; color: #64748b;">Brak wybranych stacji pośrednich (opcjonalne)</span>
                    </div>
                </div>

                <div class="search-subgrid">
                    <div class="form-group">
                        <label for="searchDate">Dzień podróży</label>
                        <input type="date" id="searchDate">
                    </div>
                    <div class="form-group">
                        <label for="searchTime">Od godziny</label>
                        <input type="time" id="searchTime" value="06:00">
                    </div>
                </div>

                <button class="btn-search" onclick="searchConnections()">Wyszukaj połączenia</button>
            </div>

            <div id="searchResults"></div>
        </div>

        <!-- 2. TABLICA STACYJNA -->
        <div id="station" class="tab-content">
            <div class="panel">
                <div class="panel-title">Tablica przyjazdów i odjazdów</div>

                <div class="board-header-toggle">
                    <button id="btnDep" class="board-type-btn active" onclick="setBoardType('dep')">ODJAZDY</button>
                    <button id="btnArr" class="board-type-btn" onclick="setBoardType('arr')">PRZYJAZDY</button>
                </div>

                <div class="search-subgrid">
                    <div class="form-group">
                        <label for="boardStation">Wybierz stację</label>
                        <select id="boardStation" onchange="renderStationBoard()"></select>
                    </div>
                    <div class="form-group">
                        <label for="boardDate">Wybierz datę z kalendarza</label>
                        <input type="date" id="boardDate" onchange="renderStationBoard()">
                    </div>
                </div>

                <div id="stationBoardResults"></div>
            </div>
        </div>

        <!-- 3. WYSZUKIWANIE POCIĄGU PO NUMERZE LUB NAZWIE -->
        <div id="catalog" class="tab-content">
            <div class="panel">
                <div class="panel-title">Informacje o pociągu</div>
                <div class="form-group" style="margin-bottom: 1.25rem;">
                    <label for="trainQuery">Wpisz numer pociągu lub jego nazwę</label>
                    <input type="text" id="trainQuery" placeholder="np. 44300..." oninput="searchTrainCatalog()">
                </div>
                <div id="trainCatalogResults"></div>
            </div>
        </div>

    </div>

        // =========================================================================
        // 3. LOGIKA KALENDARZA KURSOWANIA I POMOCNIKI CZASU
        // =========================================================================
        function isTrainRunningOnDate(train, dateStr) {
            if (!dateStr) return true;
            if (train.excludeDates && train.excludeDates.includes(dateStr)) {
                return false;
            }

            const [y, m, d] = dateStr.split('-').map(Number);
            const dateObj = new Date(y, m - 1, d);
            const jsDay = dateObj.getDay(); // 0 = nd, 1 = pon ... 6 = sob
            const isoDay = jsDay === 0 ? 7 : jsDay; // 1 = pon ... 7 = nd

            if (train.days === "daily") return true;
            if (train.days === "workdays") return isoDay >= 1 && isoDay <= 5;
            if (train.days === "weekends") return isoDay === 6 || isoDay === 7;

            const tokens = train.days.split(',').map(s => s.trim());
            if (tokens.includes(String(isoDay))) return true;
            if (tokens.includes(dateStr)) return true;

            return false;
        }

        function formatDaysDescription(train) {
            let desc = "";
            if (train.days === "daily") desc = "Kursuje codziennie";
            else if (train.days === "workdays") desc = "Kursuje w dni robocze (Pon–Pt)";
            else if (train.days === "weekends") desc = "Kursuje w weekendy (Sob–Nd)";
            else {
                const dayNames = { "1": "Pon", "2": "Wt", "3": "Śr", "4": "Czw", "5": "Pt", "6": "Sob", "7": "Nd" };
                const parts = train.days.split(',').map(s => s.trim());
                const mapped = parts.map(p => dayNames[p] || p);
                desc = "Kursuje: " + mapped.join(', ');
            }
            if (train.excludeDates && train.excludeDates.length > 0) {
                desc += ` (nie kursuje: ${train.excludeDates.join(', ')})`;
            }
            return desc;
        }

        function timeToMins(t) {
            if (!t) return null;
            const [h, m] = t.split(':').map(Number);
            return h * 60 + m;
        }

        function formatDuration(mins) {
            const h = Math.floor(mins / 60);
            const m = mins % 60;
            return h > 0 ? `${h} godz. ${m} min` : `${m} min`;
        }

        // =========================================================================
        // 4. SILNIK WYSZUKIWANIA POŁĄCZEŃ (BEZ PĘTLI, Z OBSŁUGĄ "NAOKOŁO" I "PRZEZ")
        // =========================================================================
        function searchConnections() {
            const src = document.getElementById('srcStation').value;
            const dest = document.getElementById('destStation').value;
            const dateStr = document.getElementById('searchDate').value;
            const minDepMins = timeToMins(document.getElementById('searchTime').value) || 0;
            const viaStations = Array.from(document.querySelectorAll('.via-select')).map(s => s.value);

            const resultsDiv = document.getElementById('searchResults');
            resultsDiv.innerHTML = '';

            if (src === dest) {
                resultsDiv.innerHTML = `<div class="panel" style="color: var(--danger); font-weight: 600;">Stacja początkowa i docelowa muszą być różne.</div>`;
                return;
            }

            if (viaStations.includes(src) || viaStations.includes(dest)) {
                resultsDiv.innerHTML = `<div class="panel" style="color: var(--danger); font-weight: 600;">Stacja pośrednia nie może być taka sama jak stacja początkowa lub docelowa.</div>`;
                return;
            }

            const activeTrains = TRAINS.filter(t => isTrainRunningOnDate(t, dateStr));
            const foundJourneys = [];

            // Przeszukiwanie grafu połączeń (DFS) - maksymalnie 2 przesiadki (3 odcinki), zero powrotów na odwiedzone stacje
            function dfs(currentStation, currentTime, visitedStations, legs, usedTrainNumbers) {
                if (currentStation === dest) {
                    // Sprawdź, czy wszystkie wymagane stacje pośrednie (viaStations) zostały odwiedzone we właściwej kolejności
                    let lastIdx = -1;
                    for (const v of viaStations) {
                        const idx = visitedStations.indexOf(v);
                        if (idx === -1 || idx < lastIdx) return;
                        lastIdx = idx;
                    }

                    foundJourneys.push({
                        legs: [...legs],
                        depTime: legs[0].depTime,
                        arrTime: legs[legs.length - 1].arrTime,
                        depMins: legs[0].depMins,
                        arrMins: legs[legs.length - 1].arrMins,
                        duration: legs[legs.length - 1].arrMins - legs[0].depMins,
                        transfers: legs.length - 1
                    });
                    return;
                }

                if (legs.length >= 3) return; // Maksymalnie 2 przesiadki

                for (const train of activeTrains) {
                    // Nigdy nie przesiadaj się na ten sam pociąg, którym już jechałeś
                    if (usedTrainNumbers.has(train.number)) continue;

                    const startIdx = train.stops.findIndex(s => s.station === currentStation);
                    if (startIdx === -1 || !train.stops[startIdx].dep) continue;

                    const trainDepMins = timeToMins(train.stops[startIdx].dep);
                    const minAllowedDep = legs.length === 0 ? minDepMins : currentTime + 3; // min. 3 min na przesiadkę
                    const maxAllowedDep = legs.length === 0 ? 24 * 60 : currentTime + 150; // max 2.5h czekania na przesiadkę

                    if (trainDepMins < minAllowedDep || trainDepMins > maxAllowedDep) continue;

                    for (let endIdx = startIdx + 1; endIdx < train.stops.length; endIdx++) {
                        const segmentStops = train.stops.slice(startIdx + 1, endIdx + 1);
                        const endStop = train.stops[endIdx];
                        if (!endStop.arr) continue;

                        // Ochrona przed pętlami: żadna stacja na tym odcinku nie mogła być wcześniej odwiedzona
                        const hasLoop = segmentStops.some(s => visitedStations.includes(s.station));
                        if (hasLoop) break; // Dalsza jazda tym pociągiem też zawierałaby tę stację

                        const newVisited = [...visitedStations, ...segmentStops.map(s => s.station)];
                        const nextTrains = new Set(usedTrainNumbers);
                        nextTrains.add(train.number);

                        legs.push({
                            train: train,
                            from: currentStation,
                            to: endStop.station,
                            depTime: train.stops[startIdx].dep,
                            arrTime: endStop.arr,
                            depMins: trainDepMins,
                            arrMins: timeToMins(endStop.arr),
                            passedStops: segmentStops.map(s => s.station)
                        });

                        dfs(endStop.station, timeToMins(endStop.arr), newVisited, legs, nextTrains);

                        legs.pop();
                    }
                }
            }

            dfs(src, minDepMins, [src], [], new Set());

            // Eliminacja absurdalnych przesiadek, jeśli istnieje dokładnie takie samo połączenie bezpośrednie o tej samej porze
            const filteredJourneys = foundJourneys.filter(j => {
                if (j.transfers === 0) return true;
                const hasBetterDirect = foundJourneys.some(d =>
                    d.transfers === 0 &&
                    d.depMins === j.depMins &&
                    d.arrMins <= j.arrMins
                );
                return !hasBetterDirect;
            });

            // Sortowanie po godzinie odjazdu, a następnie po czasie podróży
            filteredJourneys.sort((a, b) => a.depMins - b.depMins || a.duration - b.duration);

            if (filteredJourneys.length === 0) {
                resultsDiv.innerHTML = `<div class="panel" style="text-align: center; color: var(--text-muted);">Brak połączeń spełniających podane kryteria w wybranym dniu.</div>`;
                return;
            }

            filteredJourneys.forEach(j => {
                const card = document.createElement('div');
                card.className = 'journey-card';

                const badgeHtml = j.transfers === 0
                    ? `<span class="badge badge-direct">Bezpośredni</span>`
                    : `<span class="badge badge-transfer">${j.transfers === 1 ? '1 przesiadka' : j.transfers + ' przesiadki'}</span>`;

                let legsHtml = '';
                j.legs.forEach((leg, idx) => {
                    if (idx > 0) {
                        const waitMins = leg.depMins - j.legs[idx - 1].arrMins;
                        legsHtml += `<div class="transfer-divider">Przesiadka na stacji <strong>${leg.from}</strong> • Czas na przesiadkę: ${waitMins} min</div>`;
                    }

                    const t = leg.train;
                    const nameStr = t.name ? ` „${t.name}”` : '';
                    legsHtml += `
                        <div class="leg-row">
                            <div>
                                <div class="leg-train-info">
                                    <span class="train-cat">${t.category} ${t.number}</span>
                                    <strong>${t.carrier}${nameStr}</strong>
                                    <span class="train-stock">${t.rollingStock}</span>
                                </div>
                                <div class="leg-route">
                                    <strong>${leg.depTime}</strong> ${leg.from} ➔ <strong>${leg.arrTime}</strong> ${leg.to}
                                    <span style="color: var(--text-muted); font-size: 0.82rem;">(Relacja: ${t.relation})</span>
                                </div>
                            </div>
                        </div>
                    `;
                });

                card.innerHTML = `
                    <div class="journey-summary">
                        <div class="journey-times">
                            <span>${j.depTime}</span>
                            <span class="journey-arrow">➔</span>
                            <span>${j.arrTime}</span>
                        </div>
                        <div class="journey-meta">
                            ${badgeHtml}
                            <span class="badge badge-time">Czas podróży: ${formatDuration(j.duration)}</span>
                        </div>
                    </div>
                    <div class="journey-legs">
                        ${legsHtml}
                    </div>
                `;
                resultsDiv.appendChild(card);
            });
        }

        function setBoardType(type) {
            currentBoardType = type;
            document.getElementById('btnDep').classList.toggle('active', type === 'dep');
            document.getElementById('btnArr').classList.toggle('active', type === 'arr');
            renderStationBoard();

        function renderStationBoard() {
            const station = document.getElementById('boardStation').value;
            const dateStr = document.getElementById('boardDate').value;
            const container = document.getElementById('stationBoardResults');

            const activeTrains = TRAINS.filter(t => isTrainRunningOnDate(t, dateStr));
            const entries = [];

            activeTrains.forEach(train => {
                const stopIdx = train.stops.findIndex(s => s.station === station);
                if (stopIdx === -1) return;

                const stop = train.stops[stopIdx];
                if (currentBoardType === 'dep' && stop.dep) {
                    const viaList = train.stops.slice(stopIdx + 1, -1).map(s => s.station).join(', ');
                    entries.push({
                        time: stop.dep,
                        mins: timeToMins(stop.dep),
                        train: train,
                        direction: train.stops[train.stops.length - 1].station,
                        via: viaList
                    });
                } else if (currentBoardType === 'arr' && stop.arr) {
                    const viaList = train.stops.slice(1, stopIdx).map(s => s.station).join(', ');
                    entries.push({
                        time: stop.arr,
                        mins: timeToMins(stop.arr),
                        train: train,
                        direction: train.stops[0].station,
                        via: viaList
                    });
                }
            });

            entries.sort((a, b) => a.mins - b.mins);

            if (entries.length === 0) {
                container.innerHTML = `<p style="padding: 1.5rem; text-align: center; color: var(--text-muted);">Brak ${currentBoardType === 'dep' ? 'odjazdów' : 'przyjazdów'} na stacji ${station} w wybranym dniu.</p>`;
                return;
            }

            let html = `
                <div class="station-table-wrap">
                    <table class="station-board-table">
                        <thead>
                            <tr>
                                <th>Godzina</th>
                                <th>Pociąg / Przewoźnik</th>
                                <th>${currentBoardType === 'dep' ? 'Kierunek (Stacja docelowa)' : 'Z kierunku (Stacja początkowa)'}</th>
                                <th>Przez</th>
                                <th>Zestawienie</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            entries.forEach(e => {
                const t = e.train;
                const namePart = t.name ? ` „${t.name}”` : '';
                html += `
                    <tr>
                        <td class="board-time">${e.time}</td>
                        <td>
                            <span class="train-cat">${t.category} ${t.number}</span>
                            <strong>${namePart}</strong>
                            <div style="font-size: 0.78rem; color: #94a3b8;">${t.carrier}</div>
                        </td>
                        <td><strong>${e.direction}</strong></td>
                        <td style="color: #cbd5e1; font-size: 0.85rem;">${e.via || '—'}</td>
                        <td><span class="train-stock">${t.rollingStock}</span></td>
                    </tr>
                `;
            });

            html += `</tbody></table></div>`;
            container.innerHTML = html;
        }

        // =========================================================================
        // 6. WYSZUKIWARKA POCIĄGU PO NUMERZE LUB NAZWIE
        // =========================================================================
        function searchTrainCatalog() {
            const q = document.getElementById('trainQuery').value.toLowerCase().trim();
            const container = document.getElementById('trainCatalogResults');
            container.innerHTML = '';

            const matches = TRAINS.filter(t =>
                !q ||
                t.number.toLowerCase().includes(q) ||
                t.name.toLowerCase().includes(q) ||
                t.carrier.toLowerCase().includes(q) ||
                t.category.toLowerCase().includes(q)
            );

            if (matches.length === 0) {
                container.innerHTML = `<p style="color: var(--text-muted); text-align: center; padding: 1rem;">Nie znaleziono pociągu dla zapytania „${q}”.</p>`;
                return;
            }

            matches.forEach(t => {
                const card = document.createElement('div');
                card.className = 'journey-card';
                const namePart = t.name ? ` „${t.name}”` : '';

                const stopsHtml = t.stops.map(s => `
                    <div class="stop-chip">
                        <strong>${s.station}</strong>
                        <span>Przyj: ${s.arr || '—'} | Odj: ${s.dep || '—'}</span>
                    </div>
                `).join('');

                card.innerHTML = `
                    <div class="journey-summary">
                        <div class="leg-train-info" style="margin:0;">
                            <span class="train-cat">${t.category} ${t.number}</span>
                            <strong style="font-size: 1.05rem;">${t.carrier}${namePart}</strong>
                        </div>
                        <div class="journey-meta">
                            <span class="train-stock">Tabor: ${t.rollingStock}</span>
                            <span class="badge badge-time">${formatDaysDescription(t)}</span>
                        </div>
                    </div>
                    <div style="padding: 1rem 1.25rem;">
                        <div style="font-size: 0.92rem; color: #334155;">
                            <strong>Relacja pociągu:</strong> ${t.relation}
                        </div>
                        <div class="stops-timeline">
                            ${stopsHtml}
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
